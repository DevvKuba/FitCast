<div class="min-h-screen flex items-center justify-center bg-surface-container-low p-4">
  <div class="w-full max-w-md bg-white border border-border-subtle rounded-xl p-8 shadow-sm flex flex-col gap-6">

    <div class="text-center flex flex-col items-center gap-1">
      <i class="pi pi-lock text-primary text-4xl mb-2"></i>
      <h1 class="text-headline-md font-headline-md text-on-surface">Reset Password</h1>
      <p class="text-body-sm font-body-sm text-on-surface-variant">Secure your FitCast account with a new password.</p>
    </div>

    <div class="flex flex-col gap-4">
      <p-iftalabel>
        <p-password [(ngModel)]="newPassword" [feedback]="true" toggleMask="true" styleClass="w-full" inputStyleClass="w-full" />
        <label>New Password</label>
      </p-iftalabel>
      <p-iftalabel>
        <p-password [(ngModel)]="confirmPassword" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full" />
        <label>Confirm New Password</label>
      </p-iftalabel>
    </div>

    <div class="flex items-center justify-between pt-4 border-t border-border-subtle">
      <p-button label="Return home" severity="secondary" [text]="true" routerLink=""/>
      <p-button label="Submit" severity="success" icon="pi pi-arrow-right" iconPos="right" (click)="resetPassword()"/>
    </div>

  </div>
</div>
