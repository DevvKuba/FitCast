<p-dialog header="Further Verification Required" [modal]="true" [(visible)]="verifyEmailDialogVisible" [style]="{ width: '25rem' }">
    <div class="delete-message">
      <span class="p-text-secondary block mb-8">Now that your account is created ensure you verify your email before logging in</span>
      <img class="email-verification-image" src="/assets/images/plain-email-verification-image.png">
    </div>
      <div class="flex justify-end gap-2">
          <p-button label="Cancel" severity="secondary" (click)="verifyEmailDialogVisible = false" />
      </div>
</p-dialog>

<div class="min-h-screen flex items-center justify-center bg-surface-container-low p-4">
  <div class="w-full max-w-md bg-white border border-border-subtle rounded-xl p-8 shadow-sm">

    <div class="text-center mb-6">
      <h1 class="text-display-lg font-display-lg text-on-surface mb-2">FitCast</h1>
      <p class="text-body-base font-body-base text-on-surface-variant">Register Below</p>
    </div>

    <div class="flex flex-col gap-4">
      <p-iftalabel>
        <input pInputText id="firstName" class="w-full" [(ngModel)]="firstName" />
        <label>First Name</label>
      </p-iftalabel>

      <p-iftalabel>
        <input pInputText id="surname" class="w-full" [(ngModel)]="surname" />
        <label>Surname</label>
      </p-iftalabel>

      <p-iftalabel>
        <input pInputText id="email" class="w-full" [(ngModel)]="email" />
        <label>Email</label>
      </p-iftalabel>

      <p-iftalabel>
        <p-inputmask
          mask="+44 9999 999999"
          [(ngModel)]="phoneNumber"
          placeholder="+44 7700 900000"
          styleClass="w-full" />
        <label>UK Phone Number</label>
      </p-iftalabel>

      <p-iftalabel>
        <p-password [(ngModel)]="password" toggleMask="true" styleClass="w-full" inputStyleClass="w-full" />
        <label>Password</label>
      </p-iftalabel>

      <p-iftalabel>
        <p-password [(ngModel)]="confirmPassword" toggleMask="true" styleClass="w-full" inputStyleClass="w-full" />
        <label>Confirm Password</label>
      </p-iftalabel>

      <div class="flex flex-col gap-2 items-center pt-2">
        <span class="text-label-caps font-label-caps text-on-surface-variant uppercase">User Type</span>
        <p-selectbutton [options]="userTypeOptions" optionLabel="label" optionValue="value" [(ngModel)]="userType" />
      </div>

      @if(userType == "client"){
        <div class="flex flex-col gap-3 items-center border-t border-border-subtle pt-4">
          <p-iftalabel class="w-full">
            <p-inputmask
              mask="+44 9999 999999"
              [(ngModel)]="trainerVerificationPhoneNumber"
              placeholder="+44 7700 900000"
              styleClass="w-full" />
            <label>Trainer Phone Number</label>
          </p-iftalabel>
          <div class="flex items-center gap-3">
            <p-tag [value]="trainerNumberVerified ? 'Verified' : 'Not Verified'" [severity]="trainerNumberVerified ? 'success' : 'secondary'" />
            <p-button label="Verify" severity="info" (click)="verifyClientUnderTrainer(trainerVerificationPhoneNumber, firstName)"/>
          </div>
        </div>
      }

      <div class="flex flex-col gap-2 pt-2">
        <p-button label="Register" severity="success" styleClass="w-full"
          (click)="userRegister(email, firstName, surname, phoneNumber, userType, verifiedClientId, verifiedTrainerId, password, confirmPassword)"/>
        <p-button label="To Login" severity="secondary" [outlined]="true" styleClass="w-full" routerLink="/login"/>
      </div>
    </div>

  </div>
</div>
