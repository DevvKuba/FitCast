<div class="min-h-screen flex items-center justify-center bg-surface-container-low p-4">
  <div class="w-full max-w-[420px] bg-white border border-border-subtle rounded-lg p-8 flex flex-col gap-6 shadow-sm">

    <div class="text-center flex flex-col gap-1">
      <h1 class="text-headline-md font-headline-md text-slate-navy">Login Below</h1>
      <p class="text-body-sm font-body-sm text-on-surface-variant">Access your FitCast portal</p>
    </div>

    <div class="flex flex-col gap-4">
      <p-iftalabel>
        <input pInputText id="email" class="w-full" [(ngModel)]="email" />
        <label>Email</label>
      </p-iftalabel>

      <p-iftalabel>
        <p-password [(ngModel)]="password" [feedback]="false" toggleMask="true" styleClass="w-full" inputStyleClass="w-full" />
        <label>Password</label>
      </p-iftalabel>

      <div class="flex flex-col gap-2 items-center pt-2">
        <span class="text-label-caps font-label-caps text-on-surface-variant uppercase">User Type</span>
        <p-selectbutton [options]="userTypeOptions" optionLabel="label" optionValue="value" [(ngModel)]="userType" />
      </div>

      <p-button label="Login" severity="success" styleClass="w-full mt-2" (click)="userLogin(email, password, userType)" />
    </div>

    <div class="flex flex-col items-center gap-3 pt-4 border-t border-border-subtle">
      <a routerLink="/register" class="text-body-sm font-body-sm text-tertiary hover:text-primary transition-colors cursor-pointer">To Register</a>
      <a (click)="sendResetEmail(email)" class="text-body-sm font-body-sm text-tertiary hover:text-primary transition-colors cursor-pointer">Reset Password</a>
      <a (click)="sendVerificationEmail(email)" class="text-body-sm font-body-sm text-tertiary hover:text-primary transition-colors cursor-pointer">Resend Email Verification</a>
    </div>

  </div>
</div>
